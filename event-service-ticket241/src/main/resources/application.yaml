spring:
  application:
    name: event-service-ticket241
  datasource:
    url: jdbc:postgresql://localhost:5432/event_service_db
    username: postgres
    password: azerty
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
      acks: all
      retries: 3
    # Désérialisation, conversion JSON, ack et retries : voir KafkaListenerConfig
    consumer:
      group-id: event-service-group

server:
  port: 9001

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/

# Indispensable à la réservation de billets : sans Kafka, aucune place n'est réservée et les
# billets de ticket-service restent bloqués en PENDING
kafka:
  enabled: true