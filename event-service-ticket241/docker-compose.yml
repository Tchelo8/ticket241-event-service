# Kafka est géré par eureka-server-ticket241 (docker-compose.yml à la racine du repo) : pas de broker ici.
services:
  postgres:
    image: postgres:15
    container_name: event-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: event_service_db
      POSTGRES_USER: postgres
      # Fourni par la variable d'environnement DB_PASSWORD (ou un fichier .env non versionné à côté de ce fichier)
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD (même valeur que pour event-service)}
    volumes:
      - event_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  event_postgres_data:
