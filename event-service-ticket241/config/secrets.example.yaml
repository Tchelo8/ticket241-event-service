# Modèle des secrets d'event-service (versionné, SANS valeurs).
#
# En local : copier ce fichier en config/application.yaml (ignoré par Git) et remplir les valeurs.
# Sur un serveur : définir les variables d'environnement indiquées à la place.
spring:
  datasource:
    # Variable d'environnement : DB_PASSWORD
    password: <DB_PASSWORD>
event:
  internal:
    # Variable d'environnement : INTERNAL_API_KEY
    # IDENTIQUE dans auth-service, event-service, ticket-service et notification-service
    api-key: <INTERNAL_API_KEY>
